<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Đọc Bài - Language Garden</title>
    <link rel="stylesheet" href="../../../shared/retro.css?v=63">
    <link rel="stylesheet" href="../../shared/language.css?v=2">
    <link rel="stylesheet" href="reader.css?v=6">
  </head>
  <body class="language-theme" data-game="vn-reader">
    <main class="screen reader-screen">
      <nav class="top-nav" aria-label="Primary">
        <a href="../../index.html#vn">Tiếng Việt 2</a>
      </nav>

      <header class="reader-header">
        <div>
          <p class="system-line">ĐỌC BÀI // READ ALONG</p>
          <h1 id="rd-title">Bài 1</h1>
        </div>
        <div class="reader-tools">
          <label class="tool-chip">Bài
            <select id="rd-lesson" aria-label="Lesson"></select>
          </label>
          <button class="tool-chip" type="button" id="rd-english" aria-pressed="true">English: on</button>
        </div>
      </header>

      <section class="reader-card" aria-live="polite">
        <span class="reader-num" id="rd-num">1</span>
        <p class="reader-vi" id="rd-vi"></p>
        <p class="reader-en" id="rd-en"></p>
        <p class="reader-gloss" id="rd-gloss" aria-live="polite" hidden></p>
        <p class="reader-tip">Chạm vào một chữ để nghe. Tap a word to hear it.</p>
      </section>

      <div class="reader-controls">
        <button class="ctl" type="button" id="rd-prev" aria-label="Previous sentence">◀</button>
        <button class="ctl ctl-main" type="button" id="rd-play">▶ Đọc câu</button>
        <button class="ctl" type="button" id="rd-next" aria-label="Next sentence">▶</button>
        <button class="ctl ctl-words" type="button" id="rd-words" title="Read word by word">▶ Từng chữ</button>
        <button class="ctl ctl-all" type="button" id="rd-all">▶▶ Đọc hết</button>
      </div>

      <nav class="reader-list" id="rd-list" aria-label="Sentences"></nav>

    </main>

    <script src="../../../shared/stage.js?v=2"></script>
    <script src="../../../shared/sounds.js?v=19"></script>
    <script src="../lessons/lessons.js?v=10"></script>
    <script src="../lessons/glossary.js?v=7"></script>
    <!-- manifest changes whenever ./vt makes new clips: always fetch a fresh copy -->
    <script>document.write('<script src="../audio/manifest.js?t=' + Date.now() + '"><\/script>');</script>
    <script src="reader.js?v=11"></script>
  </body>
</html>
